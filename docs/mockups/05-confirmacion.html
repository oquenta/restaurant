<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Mesa Fonda · Confirmación del cliente</title>
<style>
  :root{--guinda:#7c2430;--bosque:#1e4d3f;--mostaza:#e7a93c;--papel:#f7f1e6;--tinta:#221a14;--crema:#fffcf6}
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,sans-serif;background:#3d3a35;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .phone{width:392px;max-width:100%;border-radius:38px;overflow:hidden;background:var(--papel);box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .hero{background:var(--bosque);color:#fff;padding:34px 26px;text-align:center}
  .hero .ok{width:64px;height:64px;margin:0 auto;border-radius:999px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:30px}
  .hero h1{font-family:Georgia,serif;font-size:23px;margin-top:12px}
  .hero p{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px;line-height:1.55}
  .body{padding:24px}
  .lbl{text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(34,26,20,.4)}
  .code{font-family:Georgia,serif;text-align:center;font-size:44px;font-weight:900;color:var(--guinda);margin:4px 0}
  .alias{text-align:center;font-size:13.5px;color:rgba(34,26,20,.65)}
  .alias b{color:var(--tinta)}
  .timer{margin:18px auto 0;width:fit-content;display:flex;align-items:center;gap:10px;background:rgba(231,169,60,.15);color:#8a5b11;border-radius:999px;padding:10px 22px}
  .timer .t{font-family:Georgia,serif;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
  .timer small{font-weight:700;font-size:13px}
  .total{margin-top:18px;background:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(34,26,20,.06)}
  .total b{font-family:Georgia,serif;font-size:24px;color:#47141c}
  .total small{font-size:13px;color:rgba(34,26,20,.55);font-weight:600}
  .items{margin-top:10px;background:#fff;border-radius:18px;padding:6px 16px;box-shadow:0 2px 10px rgba(34,26,20,.06)}
  .items div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(34,26,20,.1);font-size:13px}
  .items div:last-child{border:0}
  .items .n{font-weight:800}
  .qty{color:var(--guinda);font-weight:900;margin-right:8px}
  .steps{display:flex;justify-content:center;gap:6px;padding:14px 24px 20px}
  .steps span{height:4px;border-radius:99px;background:rgba(34,26,20,.12);width:34px}
  .steps .on{background:var(--bosque);width:64px}
</style>
</head>
<body>
<div class="phone">
  <div class="hero">
    <div class="ok">✔</div>
    <h1>¡Tu pedido ya está en caja!</h1>
    <p>Acércate a la caja y menciona tu <b>alias</b> y tu número de pedido;<br/>caja ya están preparando tu cobro.</p>
  </div>
  <div class="body">
    <div class="lbl">Tu número de pedido</div>
    <div class="code">GQ73X</div>
    <div class="alias">Alias: <b>Mesa 4 – Cristian</b></div>
    <div class="timer">⏱ <small>Expira en</small> <span class="t">27:12</span></div>
    <div class="total"><span>Total a pagar</span><b>Bs. 173.90</b></div>
    <div class="items" style="margin-top:10px">
      <div><span><span class="qty">2×</span>Lomo saltado</span><b>Bs. 77.00</b></div>
      <div><span><span class="qty">2×</span>Cerveza artesanal</span><b>Bs. 36.00</b></div>
      <div><span><span class="qty">1×</span>Tres leches</span><b>Bs. 13.00</b></div>
    </div>
    <button style="width:100%;margin-top:14px;border:1px solid rgba(124,36,48,.25);border-radius:999px;padding:11px;background:transparent;font-weight:800;font-size:13.5px;color:var(--tinta);cursor:pointer">Seguir mirando la carta</button>
  </div>
  <div class="steps"><span class="on"></span><span></span><span></span></div>
</div>
</body>
</html>
